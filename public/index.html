<!doctype html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Payment Voice Alert</title>


<style>

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f6;
  font-family:Arial,sans-serif;
  color:#111827;
}

header{
  background:#111827;
  color:#fff;
  text-align:center;
  padding:18px;
  font-size:21px;
  font-weight:700;
}

main{
  max-width:520px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 5px 18px #0001;
}


/* =========================
   BALANCE
========================= */

.balance{
  background:
  linear-gradient(
    135deg,
    #2563eb,
    #7c3aed
  );

  color:#fff;
}

.label{
  font-size:14px;
}

.amount{
  font-size:36px;
  font-weight:800;
  margin:8px 0 16px;
}


/* =========================
   BUTTON
========================= */

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-weight:700;
  cursor:pointer;
}

.refresh{
  color:#2563eb;
}

.voice{
  background:#111827;
  color:#fff;
  width:100%;
  margin:7px 0;
}

.voice.repeat{
  background:#2563eb;
}


/* =========================
   QR
========================= */

.qr{
  text-align:center;
}

.qr img{
  width:290px;
  max-width:100%;
  border-radius:12px;
  display:block;
  margin:auto;
}

.qr p{
  margin-bottom:8px;
}


/* =========================
   COUNTDOWN
========================= */

.countdown{
  margin-top:12px;
  padding:12px;

  background:#111827;

  color:#fff;

  border-radius:10px;

  font-size:21px;

  font-weight:800;

  text-align:center;
}

.expired{
  background:#dc2626;
}


/* =========================
   TEXT
========================= */

.muted{
  color:#6b7280;
  font-size:13px;
}

.status{
  color:#16a34a;
  font-size:13px;
  font-weight:600;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}


/* =========================
   TRANSACTION
========================= */

.row{
  padding:14px 0;
  border-bottom:1px solid #e5e7eb;
}

.green{
  color:#16a34a;
  font-weight:700;
  font-size:18px;
  margin:5px 0;
}


/* =========================
   VOICE STATUS
========================= */

.voiceStatus{
  display:none;

  background:#dcfce7;

  color:#15803d;

  padding:10px;

  border-radius:10px;

  text-align:center;

  font-size:13px;

  margin:8px 0;
}

</style>

</head>


<body>


<header>
Payment Voice Alert
</header>


<main>


<!-- =========================
     BALANCE
========================= -->

<section class="card balance">

  <div class="label">
    Total Collect Amount
  </div>

  <div
    class="amount"
    id="total">
    ₹0.00
  </div>

  <button
    class="refresh"
    onclick="load()">

    🔄 Refresh Balance

  </button>

</section>



<!-- =========================
     QR CODE
========================= -->

<section class="card qr">

  <h2>
    Scan & Pay
  </h2>


  <img
    src="/qr.png"
    alt="UPI QR Code"
    id="qrImage"
  >


  <!-- 5 MINUTE COUNTDOWN -->

  <div
    id="qrCountdown"
    class="countdown">

    ⏱️ 05:00

  </div>


  <p>
    Scan using your UPI app.
  </p>


  <div class="muted">
    Google Pay • PhonePe • Paytm • BHIM
  </div>

</section>



<!-- =========================
     TRANSACTION HISTORY
========================= -->

<section class="card">

  <h2>
    Transaction History
  </h2>


  <!-- ENABLE VOICE -->

  <button
    class="voice"
    onclick="enableVoice()"
    id="voice">

    🔊 বাংলা Voice Alert চালু করুন

  </button>


  <!-- VOICE STATUS -->

  <div
    class="voiceStatus"
    id="voiceStatus">

    ● বাংলা Voice Alert চালু আছে

  </div>


  <!-- REPEAT LAST PAYMENT -->

  <button
    class="voice repeat"
    onclick="repeatLastPayment()">

    🔁 Repeat Last Payment

  </button>


  <div
    id="list">

    <div class="empty">
      Loading...
    </div>

  </div>

</section>


</main>



<script>


/* =================================
   VARIABLES
================================= */

let known = new Set();

let first = true;

let voice = false;

let lastPayment = null;


/* =================================
   5 MINUTE QR TIMER
================================= */

let qrSeconds = 5 * 60;


/* =================================
   GET BENGALI VOICE
================================= */

function getBengaliVoice(){

  if(!("speechSynthesis" in window)){
    return null;
  }


  const voices =
    speechSynthesis.getVoices();


  let voice =
    voices.find(
      v =>
      v.lang &&
      v.lang.toLowerCase() === "bn-in"
    );


  if(!voice){

    voice =
      voices.find(
        v =>
        v.lang &&
        v.lang.toLowerCase()
          .startsWith("bn")
      );

  }


  return voice || null;

}


/* =================================
   BENGALI SPEAK
================================= */

function speakBengali(text){

  if(!("speechSynthesis" in window)){

    alert(
      "এই browser-এ Voice Support নেই"
    );

    return;

  }


  speechSynthesis.cancel();


  const msg =
    new SpeechSynthesisUtterance(text);


  msg.lang = "bn-IN";

  msg.rate = 0.88;

  msg.pitch = 1;

  msg.volume = 1;


  const bnVoice =
    getBengaliVoice();


  if(bnVoice){
    msg.voice = bnVoice;
  }


  speechSynthesis.speak(msg);

}


/* =================================
   ENABLE VOICE
================================= */

function enableVoice(){

  if(!("speechSynthesis" in window)){

    alert(
      "এই browser-এ Voice Support নেই"
    );

    return;

  }


  voice = true;


  document.getElementById(
    "voice"
  ).textContent =
    "🔊 বাংলা Voice Alert চালু আছে";


  document.getElementById(
    "voiceStatus"
  ).style.display =
    "block";


  speakBengali(
    "বাংলা পেমেন্ট ভয়েস অ্যালার্ট চালু হয়েছে"
  );

}


/* =================================
   PAYMENT ANNOUNCEMENT
================================= */

function announcePayment(amount){

  if(!voice){
    return;
  }


  const value =
    Number(amount || 0)
      .toFixed(2);


  speakBengali(
    "আপনার অ্যাকাউন্টে টাকা জমা হয়েছে। " +
    value +
    " টাকা ধন্যবাদ।"
  );

}


/* =================================
   REPEAT LAST PAYMENT
================================= */

function repeatLastPayment(){

  if(!("speechSynthesis" in window)){

    alert(
      "এই browser-এ Voice Support নেই"
    );

    return;

  }


  if(!lastPayment){

    alert(
      "এখনও কোনো payment পাওয়া যায়নি"
    );

    return;

  }


  const amount =
    Number(
      lastPayment.amount || 0
    ).toFixed(2);


  speechSynthesis.cancel();


  const msg =
    new SpeechSynthesisUtterance(
      "শেষ পেমেন্ট পাওয়া গেছে। " +
      amount +
      " টাকা ধন্যবাদ।"
    );


  msg.lang = "bn-IN";

  msg.rate = 0.88;

  msg.pitch = 1;

  msg.volume = 1;


  const bnVoice =
    getBengaliVoice();


  if(bnVoice){
    msg.voice = bnVoice;
  }


  speechSynthesis.speak(msg);

}


/* =================================
   ESCAPE HTML
================================= */

function esc(x){

  return String(x ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    );

}


/* =================================
   LOAD PAYMENTS
================================= */

async function load(){

  try{

    const r =
      await fetch(
        "/payments",
        {
          cache:"no-store"
        }
      );


    if(!r.ok){

      throw new Error(
        "Payment API error"
      );

    }


    const d =
      await r.json();


    /* =========================
       TOTAL BALANCE
    ========================= */

    document.getElementById(
      "total"
    ).textContent =
      "₹" +
      Number(
        d.total || 0
      ).toFixed(2);


    const list =
      document.getElementById(
        "list"
      );


    list.innerHTML = "";


    /* =========================
       PAYMENT DATA
    ========================= */

    let payments =
      Array.isArray(d.payments)
      ? d.payments
      : [];


    /* =========================
       24 HOUR FILTER
       WEBSITE থেকে পুরোনো payment hide
    ========================= */

    const now =
      Date.now();


    payments =
      payments.filter(
        p => {

          if(!p.createdAt){
            return true;
          }


          const time =
            new Date(
              p.createdAt
            ).getTime();


          if(
            Number.isNaN(time)
          ){
            return true;
          }


          const age =
            now - time;


          return age <
            24 * 60 * 60 * 1000;

        }
      );


    /* =========================
       NO PAYMENT
    ========================= */

    if(!payments.length){

      lastPayment = null;


      list.innerHTML =
        '<div class="empty">' +
        'No transactions in last 24 hours' +
        '</div>';


      first = false;

      return;

    }


    /* =========================
       LATEST PAYMENT
    ========================= */

    lastPayment =
      payments[0];


    /* =========================
       DISPLAY PAYMENTS
    ========================= */

    for(
      const p of payments
    ){

      const id =
        p.paymentId || "";


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "row";


      div.innerHTML = `

        <div>
          Payment ID:
          <b>
            ${esc(id)}
          </b>
        </div>

        <div class="green">
          + ₹${Number(
            p.amount || 0
          ).toFixed(2)}
        </div>

        <div>
          Method:
          ${esc(
            p.method || "UPI"
          )}
        </div>

        <div>
          ${esc(
            p.email || ""
          )}
        </div>

        <div class="status">
          ● ${esc(
            p.status || "captured"
          )}
        </div>

        <div class="muted">
          ${
            p.createdAt
            ? new Date(
                p.createdAt
              ).toLocaleString(
                "bn-IN"
              )
            : ""
          }
        </div>

      `;


      list.appendChild(div);


      /* =========================
         NEW PAYMENT VOICE
      ========================= */

      if(
        !first &&
        !known.has(id) &&
        !p.voicePlayed &&
        voice
      ){

        announcePayment(
          p.amount
        );


        fetch(
          "/payments/" +
          encodeURIComponent(id) +
          "/voice-played",
          {
            method:"POST"
          }
        )
        .catch(
          () => {}
        );

      }


      known.add(id);

    }


    first = false;

  }

  catch(e){

    console.error(e);


    document.getElementById(
      "list"
    ).innerHTML =
      '<div class="empty">' +
      'Unable to load transactions' +
      '</div>';

  }

}


/* =================================
   QR COUNTDOWN
================================= */

function startQRCountdown(){

  const countdown =
    document.getElementById(
      "qrCountdown"
    );


  const timer =
    setInterval(

      function(){

        const minutes =
          Math.floor(
            qrSeconds / 60
          );


        const seconds =
          qrSeconds % 60;


        countdown.textContent =
          "⏱️ " +
          String(
            minutes
          ).padStart(
            2,
            "0"
          ) +
          ":" +
          String(
            seconds
          ).padStart(
            2,
            "0"
          );


        if(
          qrSeconds <= 0
        ){

          clearInterval(
            timer
          );


          countdown.textContent =
            "❌ QR Code Expired";


          countdown.classList.add(
            "expired"
          );


          return;

        }


        qrSeconds--;

      },

      1000

    );

}


/* =================================
   BROWSER VOICES LOAD
================================= */

if(
  "speechSynthesis" in window
){

  speechSynthesis.onvoiceschanged =
    function(){

      speechSynthesis.getVoices();

    };

}


/* =================================
   START WEBSITE
================================= */

load();


/* CHECK PAYMENT EVERY 5 SECOND */

setInterval(
  load,
  5000
);


/* START QR TIMER */

startQRCountdown();


</script>

</body>

</html>
