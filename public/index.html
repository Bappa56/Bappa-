<!doctype html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Payment Voice Alert</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f3f4f6;
  font-family:Arial,sans-serif;
  color:#111827
}

header{
  background:#111827;
  color:#fff;
  text-align:center;
  padding:18px;
  font-size:21px;
  font-weight:700
}

main{
  max-width:520px;
  margin:auto;
  padding:16px
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 5px 18px #0001
}

.balance{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff
}

.label{
  font-size:14px
}

.amount{
  font-size:36px;
  font-weight:800;
  margin:8px 0 16px
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-weight:700;
  cursor:pointer
}

.refresh{
  color:#2563eb
}

.voice{
  background:#111827;
  color:#fff;
  width:100%;
  margin:10px 0
}

.qr{
  text-align:center
}

.qr img{
  width:290px;
  max-width:100%;
  border-radius:12px
}

.muted{
  color:#6b7280;
  font-size:13px
}

.row{
  padding:13px 0;
  border-bottom:1px solid #e5e7eb
}

.green{
  color:#16a34a;
  font-weight:700
}

.empty{
  text-align:center;
  color:#777;
  padding:20px
}

.status{
  color:#16a34a;
  font-size:13px
}

/* QR COUNTDOWN */

.countdown{
  margin-top:12px;
  padding:10px;
  background:#111827;
  color:#fff;
  border-radius:10px;
  font-size:20px;
  font-weight:800;
  text-align:center
}

.expired{
  background:#dc2626
}

</style>
</head>


<body>

<header>
Payment Voice Alert
</header>


<main>


<!-- BALANCE -->

<section class="card balance">

<div class="label">
Total Collect Amount
</div>

<div class="amount" id="total">
₹0.00
</div>

<button class="refresh" onclick="load()">
🔄 Refresh Balance
</button>

</section>


<!-- QR CODE -->

<section class="card qr">

<h2>
Scan & Pay
</h2>

<img
src="/qr.png"
alt="UPI QR Code"
>

<!-- 5 MINUTE COUNTDOWN -->

<div
id="qrCountdown"
class="countdown"
>
⏱️ 05:00
</div>

<p>
Scan using your UPI app.
</p>

<div class="muted">
Google Pay • PhonePe • Paytm • BHIM
</div>

</section>


<!-- TRANSACTION HISTORY -->

<section class="card">

<h2>
Transaction History
</h2>


<!-- VOICE BUTTON -->

<button
class="voice"
onclick="enableVoice()"
id="voice"
>
🔊 বাংলা Voice Alert চালু করুন
</button>


<div
id="voiceStatus"
class="status"
style="display:none"
>
● বাংলা Voice Alert চালু আছে
</div>


<div id="list">

<div class="empty">
Loading...
</div>

</div>

</section>


</main>


<script>

/* =================================
   VARIABLES
================================= */

let known = new Set();

let first = true;

let voice = false;


/* =================================
   BENGALI VOICE
================================= */

function getBengaliVoice(){

  if(!("speechSynthesis" in window)){
    return null;
  }

  const voices =
    speechSynthesis.getVoices();

  let bn =
    voices.find(v =>
      v.lang &&
      v.lang.toLowerCase() === "bn-in"
    );

  if(!bn){

    bn =
      voices.find(v =>
        v.lang &&
        v.lang.toLowerCase().startsWith("bn")
      );

  }

  return bn || null;
}


/* =================================
   SPEAK BENGALI
================================= */

function speakBengali(text){

  if(!("speechSynthesis" in window)){

    alert(
      "এই browser-এ Voice Support নেই"
    );

    return;
  }

  speechSynthesis.cancel();

  const msg =
    new SpeechSynthesisUtterance(text);

  msg.lang = "bn-IN";

  msg.rate = 0.88;

  msg.pitch = 1;

  msg.volume = 1;


  const bnVoice =
    getBengaliVoice();

  if(bnVoice){

    msg.voice = bnVoice;

  }

  speechSynthesis.speak(msg);
}


/* =================================
   ENABLE VOICE
================================= */

function enableVoice(){

  if(!("speechSynthesis" in window)){

    alert(
      "এই browser-এ Voice Support নেই"
    );

    return;
  }

  voice = true;


  document.getElementById("voice")
    .textContent =
    "🔊 বাংলা Voice Alert চালু আছে";


  document.getElementById("voiceStatus")
    .style.display =
    "block";


  speakBengali(
    "বাংলা পেমেন্ট ভয়েস অ্যালার্ট চালু হয়েছে"
  );
}


/* =================================
   PAYMENT ANNOUNCEMENT
================================= */

function announcePayment(amount){

  if(!voice) return;


  const value =
    Number(amount || 0).toFixed(2);


  speakBengali(
    "পেমেন্ট রিসিভ হয়েছে আপনার ব্যাংক অ্যাকাউন্টে । " +
    value +
    " টাকা ধন্যবাদ।"
  );
}


/* =================================
   ESCAPE HTML
================================= */

function esc(x){

  return String(x ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}


/* =================================
   LOAD PAYMENT DATA
================================= */

async function load(){

  try{

    const r =
      await fetch(
        "/payments",
        {
          cache:"no-store"
        }
      );


    const d =
      await r.json();


    /* TOTAL */

    document.getElementById("total")
      .textContent =
      "₹" +
      Number(
        d.total || 0
      ).toFixed(2);


    const list =
      document.getElementById("list");


    list.innerHTML = "";


    /* NO TRANSACTION */

    if(!d.payments?.length){

      list.innerHTML =
        '<div class="empty">' +
        'No transactions yet' +
        '</div>';


      first = false;

      return;
    }


    /* TRANSACTION LIST */

    for(const p of d.payments){

      const id =
        p.paymentId || "";


      const div =
        document.createElement("div");


      div.className =
        "row";


      div.innerHTML = `

        <div>
          Payment ID:
          <b>${esc(id)}</b>
        </div>

        <div class="green">
          + ₹${Number(
            p.amount || 0
          ).toFixed(2)}
        </div>

        <div>
          Method:
          ${esc(
            p.method || "UPI"
          )}
        </div>

        <div>
          ${esc(
            p.email || ""
          )}
        </div>

        <div class="status">
          ● ${esc(
            p.status || "captured"
          )}
        </div>

        <div class="muted">
          ${
            p.createdAt
            ? new Date(
                p.createdAt
              ).toLocaleString("bn-IN")
            : ""
          }
        </div>

      `;


      list.appendChild(div);


      /* NEW PAYMENT */

      if(
        !first &&
        !known.has(id) &&
        !p.voicePlayed &&
        voice
      ){

        announcePayment(
          p.amount
        );


        fetch(
          "/payments/" +
          encodeURIComponent(id) +
          "/voice-played",
          {
            method:"POST"
          }
        )
        .catch(
          () => {}
        );

      }


      known.add(id);

    }


    first = false;

  }

  catch(e){

    console.error(e);


    document.getElementById("list")
      .innerHTML =
      '<div class="empty">' +
      'Unable to load transactions' +
      '</div>';

  }

}


/* =================================
   LOAD BENGALI VOICES
================================= */

if(
  "speechSynthesis" in window
){

  speechSynthesis.onvoiceschanged =
    function(){

      speechSynthesis.getVoices();

    };

}


/* =================================
   QR 5 MINUTE COUNTDOWN
================================= */

let qrSeconds = 5 * 60;


function startQRCountdown(){

  const countdown =
    document.getElementById(
      "qrCountdown"
    );


  const timer =
    setInterval(

      () => {

        const minutes =
          Math.floor(
            qrSeconds / 60
          );


        const seconds =
          qrSeconds % 60;


        countdown.textContent =
          "⏱️ " +
          String(
            minutes
          ).padStart(2,"0") +
          ":" +
          String(
            seconds
          ).padStart(2,"0");


        if(qrSeconds <= 0){

          clearInterval(timer);


          countdown.textContent =
            "❌ QR Code Expired";


          countdown.classList.add(
            "expired"
          );


          return;
        }


        qrSeconds--;

      },

      1000

    );

}


/* =================================
   START
================================= */

load();

setInterval(
  load,
  5000
);


/* START QR TIMER */

startQRCountdown();

</script>

</body>
</html>
