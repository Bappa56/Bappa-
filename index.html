<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Voice Dashboard</title>
<style>
body{font-family:system-ui;margin:0;background:#10131a;color:#fff;padding:20px}
.card{max-width:650px;margin:auto;background:#181d27;border-radius:18px;padding:20px}
h1{margin-top:0}.amount{font-size:42px;font-weight:800;margin:10px 0}
.row{padding:14px 0;border-bottom:1px solid #303744}.muted{color:#9da7b5}
button{padding:12px 16px;border:0;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>💰 Payment Received</h1>
<div id="latest" class="muted">Waiting for payment...</div>
<div id="amount" class="amount">₹0</div>
<button id="test">Test Voice</button>
<div id="history"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, query, orderByChild, limitToLast, onChildAdded }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBn6wSgcczpVwqoZLjFamokPpnQyMEMs_8",
  authDomain: "turnement-cbb42.firebaseapp.com",
  databaseURL: "https://turnement-cbb42-default-rtdb.firebaseio.com",
  projectId: "turnement-cbb42",
  storageBucket: "turnement-cbb42.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const payments = query(ref(db,"payments"), orderByChild("createdAt"), limitToLast(50));

function speak(amount){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const text = `Payment received ${Number(amount).toLocaleString("en-IN")} rupees`;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-IN";
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

document.querySelector("#test").onclick=()=>speak(500);

onChildAdded(payments, snap=>{
  const p=snap.val();
  document.querySelector("#latest").textContent =
    `Payment ID: ${p.paymentId || snap.key}`;
  document.querySelector("#amount").textContent =
    `₹${Number(p.amount||0).toLocaleString("en-IN")}`;

  const row=document.createElement("div");
  row.className="row";
  row.innerHTML=`<b>₹${Number(p.amount||0).toLocaleString("en-IN")}</b>
  <div class="muted">${p.paymentId||snap.key} • ${p.status||""}</div>`;
  document.querySelector("#history").prepend(row);

  // Voice is intentionally client-side; browser must have permission/user interaction.
  speak(p.amount||0);
});
</script>
</body>
</html>
